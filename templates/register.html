{% extends "base.html" %}

{% block title %}Register | SleepSenseAI{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div style="text-align:center; margin-bottom:25px;">

            <h2>Create Your Account</h2>

            <p style="color:#64748b;">
                Join SleepSenseAI and start monitoring your sleep health.
            </p>

        </div>

        <form method="POST" action="/register">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="fullname"
                    class="form-control"
                    placeholder="Enter full name"
                    required>

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Create password"
                    required>

                <small id="strength"></small>

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm password"
                    required>

            </div>

            <div class="form-group">

                <label>Age</label>

                <input
                    type="number"
                    name="age"
                    class="form-control"
                    min="1"
                    max="120"
                    placeholder="Enter age"
                    required>

            </div>

            <div class="form-group">

                <label>Gender</label>

                <select
                    name="gender"
                    class="form-control"
                    required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

            <button
                type="submit"
                class="btn-primary"
                style="width:100%; border:none;">

                Create Account

            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</section>

<script>

const form =
document.querySelector("form");

form.addEventListener(
    "submit",
    function(e){

        const pass =
        document.getElementById(
            "password"
        ).value;

        const confirm =
        document.getElementById(
            "confirmPassword"
        ).value;

        if(pass !== confirm){

            e.preventDefault();

            alert(
                "Passwords do not match"
            );

        }

    }
);

</script>

{% endblock %}
